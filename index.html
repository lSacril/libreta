@font-face{font-family:"Public Sans";font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/publicsans.woff2) format("woff2")}
@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:100 800;font-display:swap;src:url(fonts/jetbrainsmono.woff2) format("woff2")}

<title>Libreta de Préstamos</title>
<style>
/* Layout: libreta de tinta azul sobre papel frío; header con pestañas (abajo en celular), tarjetas solo para préstamos y hojas emergentes */
:root{
  --bg:#ECEFF3; --paper:#FFFFFF; --ink:#13202B; --muted:#5A6A78; --line:#D3DBE3; --rule:#E3E9EF;
  --accent:#1D4F91; --accent-soft:#DDE7F5; --on-accent:#FFFFFF;
  --ok:#23704A; --ok-soft:#DCEFE3; --warn:#9A6212; --warn-soft:#F6EAD3; --bad:#B23A26; --bad-soft:#F7E0DB;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Public Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --paper:#16202A; --ink:#E5ECF2; --muted:#93A3B1; --line:#2A3846; --rule:#1E2A35;
  --accent:#86B4F2; --accent-soft:#1D3150; --on-accent:#0B1622;
  --ok:#6CCB97; --ok-soft:#173528; --warn:#E3B062; --warn-soft:#3A2C14; --bad:#F08A76; --bad-soft:#3E1F19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151B; --paper:#16202A; --ink:#E5ECF2; --muted:#93A3B1; --line:#2A3846; --rule:#1E2A35;
  --accent:#86B4F2; --accent-soft:#1D3150; --on-accent:#0B1622;
  --ok:#6CCB97; --ok-soft:#173528; --warn:#E3B062; --warn-soft:#3A2C14; --bad:#F08A76; --bad-soft:#3E1F19;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.app{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 110px}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px 14px;border-bottom:2px solid var(--ink);position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-6px;border-bottom:1px solid var(--ink);opacity:.5}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;line-height:1}
.brand small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.tabs button svg{width:18px;height:18px}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.tabs button:focus-visible,.btn:focus-visible,.chip:focus-visible,.card:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:760px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:1px solid var(--line);justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabs button{flex-direction:column;gap:2px;font-size:11.5px;padding:6px 10px;border-radius:10px;flex:1}
  .tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
  .brand small{display:none}
}

/* Banners */
.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;margin-top:16px;padding:10px 14px;border:1px dashed var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:var(--r);font-size:14px}
.banner b{color:var(--warn)}

/* Sections */
.view{display:flex;flex-direction:column;gap:22px;padding-top:20px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2{font-family:var(--f-display);font-weight:600;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--paper);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.stat .val{font-family:var(--f-num);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .sub{font-size:12.5px;color:var(--muted)}
.stat.bad .val{color:var(--bad)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat .val{font-size:19px}}

/* Ledger list */
.ledger{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:12px 16px;border-top:1px solid var(--rule);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row:first-child{border-top:0}
.row:hover{background:var(--accent-soft)}
.row .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.row .d{font-size:13px;color:var(--muted);grid-column:1}
.row .a{text-align:right;grid-row:1 / span 2;grid-column:2;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:14px}

/* Pills & chips */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.done{background:var(--rule);color:var(--muted)}
.cat{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-weight:800;font-size:13px;font-family:var(--f-display);border:1.5px solid currentColor;flex:none}
.cat.A{color:var(--ok)} .cat.B{color:var(--warn)} .cat.C{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper);padding:6px 12px;border-radius:999px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .n{font-family:var(--f-num);font-size:12px;opacity:.75;margin-left:4px}

/* Buttons & inputs */
.btn{border:1px solid var(--line);background:var(--paper);padding:9px 14px;border-radius:10px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger[data-armed]{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.link{border:0;background:none;padding:4px 6px;color:var(--accent)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:0}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=tel],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
textarea{min-height:80px;resize:vertical}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.grid2{grid-template-columns:minmax(0,1fr)}}
form{display:flex;flex-direction:column;gap:14px}

/* Loan cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%}
.card:hover{border-color:var(--muted)}
.card .hd{display:flex;align-items:center;gap:10px;justify-content:space-between}
.card .who{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700}
.card .who span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .fig{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .fig .big{font-family:var(--f-num);font-weight:700;font-size:19px}
.bar{height:6px;background:var(--rule);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.card .ft{display:flex;flex-wrap:wrap;justify-content:space-between;font-size:13px;color:var(--muted);gap:2px 8px}

/* Sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(8,14,20,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:calc(100% - 24px);overflow:auto;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column}
.sheet-hd{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.sheet-hd h2{font-size:19px;min-width:0;overflow-wrap:anywhere}
.sheet-bd{padding:18px;display:flex;flex-direction:column;gap:18px}
.x{border:0;background:var(--paper);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1;flex:none;border:1px solid var(--line)}
@media (max-width:760px){
  .sheet-wrap{align-items:flex-end;padding:0}
  .sheet{max-width:none;border-radius:18px 18px 0 0;max-height:94%;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .22s ease-out}
  @keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
}

/* Facts & schedule */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.facts div{background:var(--paper);padding:10px 12px;min-width:0}
.facts dt{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.facts dd{margin:2px 0 0;font-family:var(--f-num);font-weight:700;font-size:16px;overflow-wrap:anywhere}
@media (max-width:480px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.preview{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.preview div{display:flex;flex-direction:column;min-width:0}
.preview span{font-size:12px;color:var(--muted);font-weight:600}
.preview b{font-family:var(--f-num);font-size:17px;overflow-wrap:anywhere}
.tbl-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-weight:700}
td{padding:9px 10px;border-top:1px solid var(--rule);vertical-align:middle}
td.r,th.r{text-align:right}
tr.is-bad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.acts{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);line-height:1.5;max-width:65ch}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.rates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:480px){.rates{grid-template-columns:minmax(0,1fr)}}
.rate-tea{font-size:12.5px;color:var(--muted)}

/* Capital */
.capital{background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:var(--r);padding:16px 18px 12px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px 22px;align-items:start}
.cap-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.cap-main .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.cap-val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:34px;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.cap-val.neg{color:var(--bad)}
.cap-main .sub{font-size:13px;color:var(--muted)}
.cap-form{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.cap-form input{flex:1 1 130px;min-width:0}
.cap-form .btns{display:flex;gap:8px;flex:1 1 100%}
.cap-form .btns .btn{flex:1}
.cap-foot{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:10px}
.cap-proj{margin-left:auto;text-align:right;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:1px}
.cap-proj b{font-family:var(--f-num);font-size:16px;color:var(--ok)}
.ex-wrap{display:flex;flex-direction:column;gap:10px}
.ex-wrap .banner{margin-top:0}
.fs{border:1px solid var(--line);border-radius:var(--r);background:var(--paper);padding:12px 14px 14px;margin:0;min-width:0}
.fs legend{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 6px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.check{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
@media (max-width:640px){.capital{grid-template-columns:minmax(0,1fr)}.cap-val{font-size:30px}}

/* Pagarés */
.seg{display:flex;gap:4px;background:var(--rule);padding:4px;border-radius:11px}
.seg button{flex:1;border:0;background:none;padding:8px 10px;border-radius:8px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg .num{font-size:12px;background:var(--accent-soft);color:var(--accent);padding:0 7px;border-radius:99px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.doc{border:1px solid var(--line);background:var(--paper);border-radius:10px;overflow:hidden;padding:0;cursor:pointer;display:flex;flex-direction:column;text-align:left}
.doc:hover{border-color:var(--muted)}
.doc img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--rule)}
.doc span{padding:7px 9px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:1px;min-width:0}
.doc b{color:var(--ink);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdf-thumb{aspect-ratio:3/4;display:grid;place-items:center;background:var(--bad-soft);color:var(--bad);font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:.04em}
.doc-group{display:flex;flex-direction:column;gap:8px}
.doc-full{width:100%;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--paper)}

/* Bloqueo con PIN */
.lock{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.lock-box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:16px;text-align:center}
.lock-box h1{font-family:var(--f-display);font-weight:800;font-size:34px;letter-spacing:-.02em;margin:0;padding-bottom:10px;border-bottom:2px solid var(--ink)}
.lock-box input{text-align:center;font-family:var(--f-num);font-size:28px;letter-spacing:.4em;padding:12px}
.lock-box .btn{width:100%;padding:12px}
.lock-err{color:var(--bad);font-size:14px;min-height:1.4em;margin:0}
.lock-forgot{display:flex;flex-direction:column;gap:10px;text-align:left}
.lock{overflow:auto}
.lock-box #rec-key{font-size:15px;letter-spacing:.04em;text-align:left;font-family:var(--f-num)}
.reckey{font-size:19px;font-weight:700;letter-spacing:.05em;padding:14px;border:2px dashed var(--accent);border-radius:10px;background:var(--paper);color:var(--ink);word-break:break-all;user-select:all;text-align:center}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
@media (min-width:761px){#toast{bottom:24px}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Libreta</h1><small id="hoy"></small><button type="button" id="lockBtn" class="btn sm" data-act="lock-now" hidden title="Bloquear la app" style="align-self:center"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Bloquear</button></div>
    <nav class="tabs" aria-label="Secciones">
      <button type="button" data-tab="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Resumen</button>
      <button type="button" data-tab="prestamos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>Préstamos</button>
      <button type="button" data-tab="clientes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.5 3.5 5.2"/></svg>Clientes</button>
      <button type="button" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes</button>

<script>
(function(){
'use strict';
const KEY = 'libreta-prestamos-v1';
let storageOK = true;

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const r2 = v => Math.round(v * 100) / 100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('es-AR', {style:'currency', currency:'ARS', maximumFractionDigits:0, minimumFractionDigits:0});
const money = v => nf.format(Math.round(v || 0));
const pct = v => (Number(v) || 0).toLocaleString('es-AR', {maximumFractionDigits:2}) + '%';
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function pad(n){ return String(n).padStart(2,'0'); }
function today(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function addMonths(iso, k){
  const [y,m,d] = iso.split('-').map(Number);
  const t = new Date(y, m - 1 + k, 1);
  const last = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return t.getFullYear() + '-' + pad(t.getMonth()+1) + '-' + pad(Math.min(d, last));
}
function addDays(iso, k){
  const [y,m,d] = iso.split('-').map(Number);
  const t = new Date(y, m-1, d + k);
  return t.getFullYear() + '-' + pad(t.getMonth()+1) + '-' + pad(t.getDate());
}
function daysBetween(a, b){
  const [y1,m1,d1] = a.split('-').map(Number), [y2,m2,d2] = b.split('-').map(Number);
  return Math.round((Date.UTC(y2,m2-1,d2) - Date.UTC(y1,m1-1,d1)) / 864e5);
}
function fdate(iso){ if(!iso) return ''; const [y,m,d] = iso.split('-'); return Number(d) + ' ' + MESES[Number(m)-1] + ' ' + y; }
const tea = monthly => (Math.pow(1 + monthly/100, 12) - 1) * 100;
const PER = {
  mensual:{year:12, word:'mensual', plural:'mensuales', cuota:'Cuota mensual'},
  semanal:{year:52, word:'semanal', plural:'semanales', cuota:'Cuota semanal'}
};
const freqOf = l => l && l.freq === 'semanal' ? 'semanal' : 'mensual';
const teaP = (rate, freq) => (Math.pow(1 + rate/100, PER[freq].year) - 1) * 100;
const weeklyFromMonthly = m => r2((Math.pow(1 + m/100, 12/52) - 1) * 100);
const monthlyFromWeekly = w => (Math.pow(1 + w/100, 52/12) - 1) * 100;

/* ---------- cálculo (sistema francés) ---------- */
function buildSchedule(amount, n, ratePct, firstDue, freq){
  const dueAt = k => freq === 'semanal' ? addDays(firstDue, 7 * k) : addMonths(firstDue, k);
  const i = ratePct / 100;
  const c = r2(i === 0 ? amount / n : amount * i / (1 - Math.pow(1 + i, -n)));
  let bal = amount; const out = [];
  for(let k = 0; k < n; k++){
    const interest = r2(bal * i);
    let capital = r2(c - interest), amt = c;
    if(k === n - 1){ capital = r2(bal); amt = r2(capital + interest); }
    bal = r2(bal - capital);
    out.push({n:k+1, due:dueAt(k), amount:amt, interest, capital, payments:[]});
  }
  return out;
}
/* Modo "elijo cuánto me devuelve": cuotas iguales = total / n, y se calcula la tasa equivalente */
function impliedRate(amount, n, c){
  if(c * n <= amount + 0.005) return 0;
  let lo = 0, hi = 10;
  for(let k = 0; k < 100; k++){ const mid = (lo + hi) / 2, pv = c * (1 - Math.pow(1 + mid, -n)) / mid; if(pv > amount) lo = mid; else hi = mid; }
  return (lo + hi) / 2;
}
function scheduleByTotal(amount, n, total, firstDue, freq){
  const c = r2(total / n), i = impliedRate(amount, n, total / n);
  let bal = amount; const out = [];
  for(let k = 0; k < n; k++){
    const last = k === n - 1, amt = last ? r2(total - c * (n - 1)) : c;
    const interest = last ? r2(amt - bal) : r2(bal * i), capital = r2(amt - interest);
    bal = r2(bal - capital);
    out.push({n:k+1, due:freq === 'semanal' ? addDays(firstDue, 7 * k) : addMonths(firstDue, k), amount:amt, interest, capital, payments:[]});
  }
  return {cuotas:out, rate:r2(i * 100)};
}
/* Tipos de pago: normal (cuenta para la cuota y es plata que entró), mora (plata que entró, recargo por atraso)
   y descuento (cuenta para la cuota pero no es plata: lo que se perdonó al cancelar antes de tiempo) */
const paidOf = q => r2(q.payments.reduce((s,p) => s + (p.mora ? 0 : p.amount), 0));
const cashOf = q => r2(q.payments.reduce((s,p) => s + (p.desc ? 0 : p.amount), 0));
const moraPaidOf = q => r2(q.payments.reduce((s,p) => s + (p.mora ? p.amount : 0), 0));
const descOf = q => r2(q.payments.reduce((s,p) => s + (p.desc ? p.amount : 0), 0));
const numOr = (v, d) => (v === '' || v == null || !isFinite(+v)) ? d : +v;
function moraCfg(){ const c = (S && S.settings && S.settings.mora) || {}; return {rate:numOr(c.rate, 0.3), grace:numOr(c.grace, 3), cap:numOr(c.cap, 50)}; }
/* Recargo por atraso de una cuota: % diario sobre lo que falta pagar, desde que termina la gracia, con un tope por cuota */
function moraOf(q, asOf){
  const c = moraCfg(); if(!(c.rate > 0)) return 0;
  const rest = r2(q.amount - paidOf(q)); if(rest <= 0.5) return 0;
  const days = daysBetween(q.due, asOf || today()) - c.grace; if(days <= 0) return 0;
  const acc = Math.min(rest * c.rate / 100 * days, q.amount * c.cap / 100);
  return Math.max(0, r2(acc - moraPaidOf(q)));
}
function qStatus(q){
  const p = paidOf(q);
  if(p >= q.amount - 0.5) return 'pagada';
  if(q.due < today()) return 'vencida';
  if(p > 0) return 'parcial';
  return 'pendiente';
}
function loanStats(l){
  let total = 0, paid = 0, overdue = 0, paidCount = 0, interest = 0, next = null, oldestLate = null, mora = 0, cash = 0, moraPaid = 0, desc = 0;
  l.cuotas.forEach(q => {
    const p = paidOf(q), st = qStatus(q);
    total += q.amount; paid += p; interest += q.interest; cash += cashOf(q); moraPaid += moraPaidOf(q); desc += descOf(q);
    if(st === 'pagada') paidCount++;
    else { if(!next) next = q; if(st === 'vencida'){ overdue += q.amount - p; mora += moraOf(q); if(!oldestLate) oldestLate = q; } }
  });
  const owed = r2(total - paid);
  const status = owed <= 0.5 ? 'terminado' : overdue > 0.5 ? 'atrasado' : 'al-dia';
  return {total:r2(total), paid:r2(paid), owed:Math.max(0, owed), overdue:r2(overdue), paidCount, interest:r2(interest), next, oldestLate, status, cuota:l.cuotas[0] ? l.cuotas[0].amount : 0,
    mora:r2(mora), cash:r2(cash), moraPaid:r2(moraPaid), desc:r2(desc)};
}
/* Adelanto de cuotas: se pagan las próximas k cuotas pendientes. Cada cuota que todavía no venció
   lleva un descuento de pct% sobre su parte de interés; las vencidas se cobran completas. */
function advanceCalc(l, k, pctVal, date){
  const pct = Math.min(100, Math.max(0, numOr(pctVal, 0)));
  const unpaid = l.cuotas.filter(q => paidOf(q) < q.amount - 0.5);
  k = Math.min(unpaid.length, Math.max(1, Math.round(numOr(k, 1))));
  const parts = unpaid.slice(0, k).map(q => {
    const rest = r2(q.amount - paidOf(q)), late = q.due < date, inte = late ? 0 : Math.min(q.interest, rest);
    return {q, rest, late, inte:r2(inte), disc:r2(inte * pct / 100), mora:moraOf(q, date)};
  });
  const sum = key => r2(parts.reduce((a, p) => a + p[key], 0));
  return {pct, k, max:unpaid.length, parts, owed:sum('rest'), inte:sum('inte'), disc:sum('disc'), mora:sum('mora')};
}
/* Cancelación anticipada: se paga todo lo que falta, menos un % de los intereses de las cuotas que todavía no empezaron a correr.
   Las cuotas vencidas y la cuota en curso se cobran completas. */
function payoffCalc(l, pct, date){
  pct = Math.min(100, Math.max(0, numOr(pct, 0)));
  const unpaid = l.cuotas.filter(q => paidOf(q) < q.amount - 0.5);
  const cur = unpaid.findIndex(q => q.due >= date);
  let owed = 0, future = 0, mora = 0; const parts = [];
  unpaid.forEach((q, k) => {
    const rest = r2(q.amount - paidOf(q)), fi = cur >= 0 && k > cur ? Math.min(q.interest, rest) : 0;
    owed += rest; future += fi; mora += moraOf(q, date);
    parts.push({q, rest, disc:r2(fi * pct / 100)});
  });
  const disc = r2(parts.reduce((a, p) => a + p.disc, 0));
  return {pct, owed:r2(owed), future:r2(future), disc, mora:r2(mora), parts, total:r2(owed - disc)};
}
const STATUS = {
  'al-dia':['ok','Al día'], 'atrasado':['bad','Atrasado'], 'terminado':['done','Terminado'],
  'pagada':['ok','Pagada'], 'vencida':['bad','Vencida'], 'parcial':['warn','Pago parcial'], 'pendiente':['done','Pendiente']
};
const pill = s => `<span class="pill ${STATUS[s][0]}">${STATUS[s][1]}</span>`;

/* ---------- datos ---------- */
function defaults(){ return {settings:{rates:{A:6, B:9, C:12}}, clients:[], loans:[], caja:[]}; }
function seed(){
  const s = defaults(), t = today();
  const c1 = {id:uid(), name:'Marta Giménez', cat:'A', notes:'Paga siempre por transferencia.', example:true};
  const c2 = {id:uid(), name:'Diego Rodríguez', cat:'B', notes:'', example:true};
  const c3 = {id:uid(), name:'Lucía Fernández', cat:'C', notes:'Cliente nueva.', example:true};
  s.clients.push(c1, c2, c3);
  const mk = (c, amount, n, rate, first) => ({id:uid(), clientId:c.id, amount, n, rate, first, created:t, notes:'', example:true, cuotas:buildSchedule(amount, n, rate, first)});
  const l1 = mk(c1, 300000, 6, 6, addDays(addMonths(t,-3), 5));
  l1.cuotas.slice(0,3).forEach(q => q.payments.push({date:q.due, amount:q.amount}));
  const l2 = mk(c2, 150000, 4, 9, addDays(addMonths(t,-2), -3));
  l2.cuotas[0].payments.push({date:l2.cuotas[0].due, amount:l2.cuotas[0].amount});
  l2.cuotas[1].payments.push({date:addDays(l2.cuotas[1].due, 2), amount:20000});
  const l3 = mk(c3, 80000, 3, 12, addDays(t, 12));
  s.loans.push(l1, l2, l3);
  return s;
}
function rawLoad(){
  try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ storageOK = false; return null; }
}
function valid(d){ return d && typeof d === 'object' && Array.isArray(d.clients) && Array.isArray(d.loans); }
function normalize(s){
  s.settings = s.settings || defaults().settings;
  s.settings.rates = Object.assign({A:6,B:9,C:12}, s.settings.rates);
  s.caja = Array.isArray(s.caja) ? s.caja : [];
  return s;
}
/* Los datos se cargan recién al desbloquear. DK es la clave de cifrado y solo vive en memoria mientras la app está abierta. */
let S = null;
let DK = null;
const CAN_ENCRYPT = !!(window.crypto && crypto.subtle && window.isSecureContext !== false);
let saveChain = Promise.resolve();
function save(){
  if(!S) return saveChain;
  const snapshot = JSON.stringify(S);
  if(!CAN_ENCRYPT){
    try { localStorage.setItem(KEY, snapshot); storageOK = true; } catch(e){ storageOK = false; }
    return saveChain;
  }
  const key = DK;
  if(!key) return saveChain; // nunca se guarda sin cifrar
  saveChain = saveChain.then(async () => {
    try { const o = await encWith(key, snapshot); localStorage.setItem(KEY, JSON.stringify({enc:2, iv:o.iv, ct:o.ct})); storageOK = true; }
    catch(e){ storageOK = false; }
  });
  return saveChain;
}

/* Capital: lo que cargás a mano, menos lo que prestaste "de tu capital", más lo que cobraste de esos préstamos */
function capitalNow(){
  let v = S.caja.reduce((s,m) => s + m.amount, 0);
  S.loans.forEach(l => { if(l.fromCaja){ v -= l.amount; l.cuotas.forEach(q => v += cashOf(q)); } });
  return r2(v);
}
function capitalHtml(){
  const cap = capitalNow(), owed = r2(S.loans.reduce((s,l) => s + loanStats(l).owed, 0));
  return `<section class="capital" aria-label="Mi capital">
    <div class="cap-main"><span class="lbl">Mi capital</span><span class="cap-val ${cap < 0 ? 'neg' : ''}">${money(cap)}</span><span class="sub">${cap < 0 ? 'Prestaste más de lo que cargaste. Sumá tu capital.' : 'plata disponible para prestar'}</span></div>
    <div class="cap-form">
      <input id="cap-amt" type="number" min="1" step="1" inputmode="numeric" placeholder="Monto $" aria-label="Monto">
      <input id="cap-note" type="text" placeholder="Detalle (opcional)" aria-label="Detalle">
      <div class="btns"><button type="button" class="btn primary" data-act="caja-add">+ Sumar</button><button type="button" class="btn" data-act="caja-sub">− Restar</button></div>
    </div>
    <div class="cap-foot"><button type="button" class="btn sm link" data-act="open-caja">Ver movimientos</button>
      <div class="cap-proj"><span>Cuando termines de cobrar lo activo vas a tener</span><b>${money(cap + owed)}</b><span>${money(cap)} de capital + ${money(owed)} por cobrar</span></div></div>
  </section>`;
}

const UI ={tab:'resumen', filter:'activos', q:'', sheet:null, pendingImport:null};
try { const t = localStorage.getItem(KEY + ':tab'); if(['resumen', 'prestamos', 'clientes', 'ajustes'].includes(t)) UI.tab = t; } catch(e){}
/* ---------- PIN y cifrado ----------
   Los datos se cifran con una clave aleatoria (AES-256). Esa clave se guarda "envuelta" dos veces:
   una con el PIN y otra con la llave de recuperación. Sin alguno de los dos, los datos no se pueden leer. */
const PIN_KEY = KEY + ':pin';   // PIN de versiones viejas (sin cifrado), solo para migrar
const KEYS_KEY = KEY + ':keys';
const FAIL_KEY = KEY + ':pinfails';
const PIN_ITER = 600000, REC_ITER = 200000;
function getPin(){ try { return JSON.parse(localStorage.getItem(PIN_KEY)); } catch(e){ return null; } }
async function hashPin(pin, salt){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function checkPin(pin){ const p = getPin(); return !!p && (await hashPin(pin, p.salt)) === p.hash; }
function getKeys(){ try { const k = JSON.parse(localStorage.getItem(KEYS_KEY)); return k && k.v === 1 && k.pin && k.rec ? k : null; } catch(e){ return null; } }
function setKeys(k){ localStorage.setItem(KEYS_KEY, JSON.stringify(k)); }
async function kekFrom(secret, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
async function wrapDK(raw, secret, iter){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, await kekFrom(secret, salt, iter), raw);
  return {salt:b64(salt), iv:b64(iv), ct:b64(ct), iter};
}
async function unwrapDK(w, secret){
  if(!w || !(w.iter >= 100000 && w.iter <= 2000000)) throw new Error('iter');
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(w.iv)}, await kekFrom(secret, unb64(w.salt), w.iter), unb64(w.ct)));
}
async function encWith(key, text){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text));
  return {iv:b64(iv), ct:b64(ct)};
}
async function decWith(key, o){ return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv)}, key, unb64(o.ct))); }
const REC_ABC = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newRecoveryKey(){
  const b = crypto.getRandomValues(new Uint8Array(24)); let s = '';
  for(let i = 0; i < 24; i++){ s += REC_ABC[b[i] % 32]; if(i % 4 === 3 && i < 23) s += '-'; }
  return s;
}
const normRec = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const validPin = p => /^\d{6,8}$/.test(p) && !/^(\d)\1+$/.test(p) && !'0123456789'.includes(p) && !'9876543210'.includes(p);
const PIN_RULE = 'El PIN tiene que tener de 6 a 8 números y no puede ser fácil de adivinar (como 111111 o 123456).';
async function sealDoc(d){ if(!DK){ if(CAN_ENCRYPT) throw new Error('bloqueada'); return d; } const o = await encWith(DK, JSON.stringify(d)); return {id:d.id, enc:2, iv:o.iv, ct:o.ct}; }
async function openDoc(r){
  if(r && r.enc === 2){ if(!DK) return null; try { return JSON.parse(await decWith(DK, r)); } catch(e){ return null; } }
  return r;
}

const lockErr = msg => { const p = $('#lock-err'); if(p) p.textContent = msg; };
const pinInput = (name, label) => `<input name="${name}" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="${label}" aria-label="${label}">`;
function screenUnlock(){

  showLock(`<form class="lock-box" data-form="unlock" novalidate>

      : `<p class="note">El PIN no se puede recuperar. La única salida es borrar los datos de este dispositivo. Después podés restaurar una copia de seguridad.</p>`}
      <input id="wipe-confirm" type="text" autocomplete="off" placeholder="Escribí BORRAR para confirmar" aria-label="Confirmación para borrar todo" style="font-size:15px;letter-spacing:.04em">

}

    <div class="reckey num">${esc(rec)}</div>
    <label class="check" style="justify-content:center"><input type="checkbox" id="rec-ack"> Ya la anoté en un lugar seguro</label>

async function openData(raw){
  DK = await crypto.subtle.importKey('raw', raw, {name:'AES-GCM'}, false, ['encrypt', 'decrypt']);
  const blob = rawLoad();
  let migrate = false;
  if(blob && blob.enc === 2) S = normalize(JSON.parse(await decWith(DK, blob)));
  else { S = normalize(valid(blob) ? blob : (UI.startEmpty ? defaults() : seed())); migrate = true; }
  const recs = await DB.all();
  DOCS = (await Promise.all(recs.map(openDoc))).filter(Boolean);
  const clean = sanitize({settings:S.settings, clients:S.clients, loans:S.loans, caja:S.caja, docs:DOCS});
  S = normalize({settings:clean.settings, clients:clean.clients, loans:clean.loans, caja:clean.caja});
  DOCS = clean.docs || [];
  if(migrate || recs.some(r => r && r.enc !== 2)){ await save(); await DB.replace(DOCS); }
}

/* Intentos fallidos guardados: recargar la página no reinicia la espera, y cada 5 fallos la espera se duplica (hasta 1 hora) */
function failState(){ try { const s = JSON.parse(localStorage.getItem(FAIL_KEY)); return s && typeof s.n === 'number' ? s : {n:0, until:0}; } catch(e){ return {n:0, until:0}; } }
function setFail(s){ try { localStorage.setItem(FAIL_KEY, JSON.stringify(s)); } catch(e){} }
const waitText = ms => { const s = Math.ceil(ms / 1000); return s >= 120 ? Math.ceil(s / 60) + ' minutos' : s + ' segundos'; };
async function tryUnlock(f){
  const pin = f.pin.value.trim(), fs = failState();
  if(Date.now() < fs.until){ f.pin.value = ''; return lockErr('Demasiados intentos. Esperá ' + waitText(fs.until - Date.now()) + '.'); }
  if(!pin) return lockErr('Ingresá tu PIN.');
  /* El intento se cuenta antes de probarlo; si es correcto, se borra */
  fs.n++;
  if(fs.n % 5 === 0) fs.until = Date.now() + Math.min(3600000, 30000 * Math.pow(2, fs.n / 5 - 1));
  setFail(fs);
  lockErr('Abriendo…');
  const keys = getKeys();
  if(keys){
    let raw = null;
    try { raw = await unwrapDK(keys.pin, pin); } catch(e){}
    if(raw){
      setFail({n:0, until:0});
      try { await openData(raw); unlockApp(); } catch(e){ lockErr('No se pudieron abrir los datos de este dispositivo.'); }
      return;
    }
  } else if(getPin() && await checkPin(pin)){ setFail({n:0, until:0}); UI.legacyPin = pin; screenSetup('legacy'); return; }
  f.pin.value = '';
  if(fs.until > Date.now()) lockErr('PIN incorrecto. Esperá ' + waitText(fs.until - Date.now()) + ' para volver a probar.');
  else lockErr('PIN incorrecto. Te quedan ' + (5 - fs.n % 5) + ' intentos antes de tener que esperar.');
}
async function createPin(f){
  const pin = f.pin.value.trim(), rep = f.rep.value.trim();
  if(!validPin(pin)) return lockErr(PIN_RULE);
  if(pin !== rep) return lockErr('Los dos PIN no coinciden.');
  if(UI.legacyPin && pin === UI.legacyPin) return lockErr('Elegí un PIN distinto al anterior: el viejo se guardaba con una protección más débil.');
  lockErr('Protegiendo tus datos…');
  try {
    const raw = crypto.getRandomValues(new Uint8Array(32)), rec = newRecoveryKey();
    setKeys({v:1, pin:await wrapDK(raw, pin, PIN_ITER), rec:await wrapDK(raw, normRec(rec), REC_ITER)});

/* ---------- fotos de pagarés (IndexedDB, porque son pesadas para localStorage) ---------- */
let DOCS = [];
const DB = (() => {
  let dbp = null; const mem = new Map();
  const api = {ok:true};
  function open(){
    if(!dbp) dbp = new Promise((res, rej) => {
      try { const r = indexedDB.open('libreta-prestamos-docs', 1); r.onupgradeneeded = () => r.result.createObjectStore('docs', {keyPath:'id'}); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
      catch(e){ rej(e); }
    });
    return dbp;
  }
  async function tx(mode, fn){
    const db = await open();
    return new Promise((res, rej) => { const t = db.transaction('docs', mode); const req = fn(t.objectStore('docs')); t.oncomplete = () => res(req ? req.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  }
  api.all = async () => { try { return (await tx('readonly', s => s.getAll())) || []; } catch(e){ api.ok = false; return [...mem.values()]; } };
  api.put = async d => { const rec = await sealDoc(d); try { await tx('readwrite', s => s.put(rec)); } catch(e){ api.ok = false; mem.set(d.id, rec); render(); } };
  api.del = async id => { mem.delete(id); try { await tx('readwrite', s => s.delete(id)); } catch(e){} };
  api.replace = async list => { mem.clear(); const recs = await Promise.all(list.map(sealDoc)); try { await tx('readwrite', s => { s.clear(); recs.forEach(d => s.put(d)); }); } catch(e){ api.ok = false; recs.forEach(d => mem.set(d.id, d)); render(); } };
  return api;
})();
function compressImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      if(!(img.naturalWidth > 0 && img.naturalHeight > 0) || img.naturalWidth * img.naturalHeight > 60e6){ URL.revokeObjectURL(url); rej(new Error('tamaño')); return; }
      const max = 1600, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); const out = cv.toDataURL('image/jpeg', 0.75); if(!sImg(out)) rej(new Error('vacía')); else res(out);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('imagen')); };
    img.src = url;
  });
}

/* Lee un PDF y comprueba que de verdad lo sea (empieza con %PDF-) */
function readPdf(file){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => {
      const out = String(rd.result).replace(/^data:[^;,]*;base64,/, 'data:application/pdf;base64,');
      try { if(!atob(out.slice(28, 36)).startsWith('%PDF-') || !sDocData(out)) return rej(new Error('pdf')); } catch(e){ return rej(e); }
      res(out);
    };
    rd.onerror = () => rej(rd.error);
    rd.readAsDataURL(file);
  });
}

    return `<button class="row" data-act="open-client" data-id="${c.id}"><span class="t" style="display:flex;gap:10px;align-items:center">${catBadge(c.cat)}<span>${esc(c.name)}</span></span><span class="d">${act} activo${act===1?'':'s'}${c.dni ? ' · DNI ' + esc(c.dni) : ''}${c.phone ? ' · ' + esc(c.phone) : ''}${docsOf(c.id).length ? ' · ' + docsOf(c.id).length + ' documento' + (docsOf(c.id).length === 1 ? '' : 's') : ''}</span><span class="a"><span class="num" style="font-weight:700">${money(owed)}</span>${late ? pill('atrasado') : ''}</span></button>`;
  }).join('');
  const r = S.settings.rates;
  return `
  <div class="sec-head"><h2>Clientes</h2><button class="btn primary" data-act="new-client">+ Nuevo cliente</button></div>

  <div class="ledger">${rows || '<div class="empty">Todavía no hay clientes.</div>'}</div>`;
}

    <p class="note small" style="margin:0">Con 0,3% diario y 3 días de gracia, una cuota de $50.000 que se paga 10 días tarde suma $1.050 de mora. Poné 0 para no cobrar mora. Igual que los intereses, un juez puede reducir punitorios que considere abusivos.</p>
    <div class="field"><label for="set-payoff">Cancelación anticipada: descuento sobre intereses futuros (%)</label><input id="set-payoff" type="number" min="0" max="100" step="5" inputmode="numeric" data-set="payoffDisc" value="${numOr(S.settings.payoffDisc, 50)}"></div>

  <section class="panel">

    <div class="field"><label for="bk-pass">Contraseña para la copia (obligatoria: 10 caracteres o más, no solo números)</label><div style="display:flex;gap:8px"><input id="bk-pass" type="password" autocomplete="new-password" placeholder="Mínimo 10 caracteres" style="flex:1;min-width:0"><button class="btn" type="button" data-act="gen-bkpass">Generar</button></div></div>

      <button class="btn danger" data-act="wipe" data-confirm="Tocá de nuevo para borrar todo">Borrar todo</button>
    </div>
  </section>
  <p class="note small">Libreta de Préstamos · cálculo de cuotas con sistema francés (cuota fija).</p>`;

const VIEWS = {resumen:vResumen, prestamos:vPrestamos, clientes:vClientes, ajustes:vAjustes};
function render(){
  if(UI.locked || !S) return;
  $('#lockBtn').hidden = !getKeys();
  $('#hoy').textContent = 'hoy ' + fdate(today());
  const ex = S.clients.some(c => c.example) || S.loans.some(l => l.example);
  let b = '';
  const hasReal = S.loans.some(l => !l.example) || S.clients.some(c => !c.example);
  const lastBk = S.settings.lastBackup, bkDays = lastBk ? daysBetween(lastBk, today()) : null;
  if(hasReal && (bkDays === null || bkDays >= 14)) b += `<div class="banner"><span><b>${bkDays === null ? 'Todavía no hiciste ninguna copia de seguridad.' : 'Hace ' + bkDays + ' días que no hacés una copia de seguridad.'}</b> Si perdés el celular, perdés todo.</span><button class="btn sm primary" data-act="go-backup">Hacer copia ahora</button></div>`;
  if(ex) b += `<div class="banner"><span><b>Datos de ejemplo.</b> Marta, Diego y Lucía son inventados para que veas cómo funciona.</span><button class="btn sm" data-act="clear-examples">Borrar ejemplos y empezar</button></div>`;
  if(!DB.ok) b += `<div class="banner"><span><b>Los documentos no se pueden guardar</b> en este navegador. Se ven ahora, pero se pierden al cerrar.</span></div>`;
  if(!storageOK) b += `<div class="banner"><span><b>No se pueden guardar datos</b> en este navegador (modo incógnito o almacenamiento bloqueado). Lo que cargues se pierde al cerrar.</span></div>`;
  UI.bannerHtml = b;
  $('#banner').innerHTML = UI.tab === 'resumen' ? '' : b;
  $('#view').innerHTML = VIEWS[UI.tab]();
  document.querySelectorAll('.tabs button').forEach(btn => btn.setAttribute('aria-current', btn.dataset.tab === UI.tab ? 'page' : 'false'));
  if(UI.sheet) renderSheet();
}
function commit(msg){ save(); render(); if(msg) toast(msg); }

/* ---------- acciones ---------- */
function applyPayment(l, i, amount, date, withMora){
  let left = r2(amount); const group = uid();
  if(withMora){
    for(let k = 0; k < l.cuotas.length && left > 0.004; k++){
      const q = l.cuotas[k], mo = moraOf(q, date);
      if(mo <= 0.004) continue;
      const take = r2(Math.min(mo, left));
      q.payments.push({date, amount:take, mora:true, group});
      left = r2(left - take);
    }
  }
  for(let k = i; k < l.cuotas.length && left > 0.004; k++){
    const q = l.cuotas[k], rest = r2(q.amount - paidOf(q));
    if(rest <= 0.004) continue;
    const take = r2(Math.min(rest, left));
    q.payments.push({date, amount:take, group});
    left = r2(left - take);
  }
  return {left, group};
}
function applyAdvance(l, k, pctVal, date, withMora){
  const r = advanceCalc(l, k, pctVal, date), group = uid();
  r.parts.forEach(p => {
    if(withMora && p.mora > 0.004) p.q.payments.push({date, amount:p.mora, mora:true, group});
    const cash = r2(p.rest - p.disc);
    if(cash > 0.004) p.q.payments.push({date, amount:cash, group});
    if(p.disc > 0.004) p.q.payments.push({date, amount:p.disc, desc:true, group});
  });
  return group;
}
function applyPayoff(l, pctVal, date, withMora){
  const r = payoffCalc(l, pctVal, date), group = uid();
  if(withMora) l.cuotas.forEach(q => { const mo = moraOf(q, date); if(mo > 0.004) q.payments.push({date, amount:mo, mora:true, group}); });
  r.parts.forEach(p => {
    const cash = r2(p.rest - p.disc);
    if(cash > 0.004) p.q.payments.push({date, amount:cash, group});
    if(p.disc > 0.004) p.q.payments.push({date, amount:p.disc, desc:true, group});
  });
  return group;
}

function copyText(text, okMsg, onOk){
  const done = () => { toast(okMsg); if(onOk) onOk(); };
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch(e){} ta.remove(); if(ok) done(); else toast('No se pudo copiar. Probá desde otro navegador.'); };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch(e){ fallback(); }
}

/* ---------- copias con contraseña (AES-GCM, clave derivada con PBKDF2) ---------- */
const b64 = buf => { let s = ''; const a = new Uint8Array(buf); for(let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function deriveKey(pass, salt, iter){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt', 'decrypt']);
}
const BK_ITER = 600000;
async function encryptBackup(text, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, await deriveKey(pass, salt, BK_ITER), new TextEncoder().encode(text));
  return JSON.stringify({app:'libreta-prestamos', enc:1, iter:BK_ITER, salt:b64(salt), iv:b64(iv), data:b64(ct)});
}
async function decryptBackup(obj, pass){
  const iter = obj.iter >= 100000 && obj.iter <= 2000000 ? obj.iter : 310000;
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(obj.iv)}, await deriveKey(pass, unb64(obj.salt), iter), unb64(obj.data));
  return new TextDecoder().decode(pt);
}
async function buildExport(){
  const pass = ($('#bk-pass') || {}).value || '';
  if(pass.length < 10 || /^\d+$/.test(pass) || /^(.)\1+$/.test(pass)){ toast('La contraseña de la copia tiene que tener al menos 10 caracteres y no ser solo números. Podés tocar "Generar".'); const i = $('#bk-pass'); if(i) i.focus(); return null; }
  try { return await encryptBackup(exportData(), pass); }
  catch(e){ toast('Este navegador no puede proteger la copia con contraseña.'); return null; }
}

/* ---------- limpieza de copias importadas: una copia manipulada no puede meter código ---------- */
const prim = v => (typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean') ? v : undefined;
const sId = v => { const s = String(prim(v) ?? ''); return /^[a-z0-9]{1,40}$/i.test(s) ? s : uid(); };
const sOptId = v => { const p = prim(v); return p == null || p === '' ? null : (/^[a-z0-9]{1,40}$/i.test(String(p)) ? String(p) : null); };
const sNum = (v, d = 0, lo = -1e12, hi = 1e12) => { const p = prim(v); const n = typeof p === 'number' ? p : (typeof p === 'string' && p.trim() !== '' ? Number(p) : NaN); return isFinite(n) ? Math.min(hi, Math.max(lo, n)) : d; };
const validISO = x => { if(!/^\d{4}-\d{2}-\d{2}$/.test(x)) return false; const [y, m, dd] = x.split('-').map(Number); if(y < 1900 || y > 2100) return false; const u = new Date(Date.UTC(y, m - 1, dd)); return u.getUTCMonth() === m - 1 && u.getUTCDate() === dd; };
const sDate = (v, d) => { const p = prim(v); return typeof p === 'string' && validISO(p) ? p : d; };
const sStr = (v, max = 2000) => String(prim(v) ?? '').slice(0, max);
const sDocData = v => { const p = prim(v); return typeof p === 'string' && p.length < 15e6 && /^data:(image\/(jpeg|png|webp)|application\/pdf);base64,[A-Za-z0-9+/=]+$/.test(p) ? p : ''; };
const sImg = v => { const p = prim(v); return typeof p === 'string' && p.length < 15e6 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p) ? p : ''; };
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const LIMITS = {clients:5000, loans:10000, cuotas:520, payments:1000, caja:20000, docs:2000};
function sanitize(d){
  const t = today();
  const clients = d.clients.filter(isObj).slice(0, LIMITS.clients).map(c => {
    const o = {id:sId(c.id)};
    CLIENT_KEYS.forEach(k => { if(c[k] != null) o[k] = k === 'birth' ? sDate(c[k], '') : k === 'cat' ? c[k] : sStr(c[k]); });
    o.name = o.name || 'Sin nombre'; o.cat = ['A','B','C'].includes(c.cat) ? c.cat : 'B';
    if(c.example) o.example = true;
    return o;
  });
  const loans = d.loans.filter(l => isObj(l) && Array.isArray(l.cuotas) && l.cuotas.length).slice(0, LIMITS.loans).map(l => {
    const cuotas = l.cuotas.filter(isObj).slice(0, LIMITS.cuotas).map((q, i) => ({n:i + 1, due:sDate(q.due, t), amount:sNum(q.amount, 0, 0), interest:sNum(q.interest), capital:sNum(q.capital),
      payments:(Array.isArray(q.payments) ? q.payments : []).filter(isObj).slice(0, LIMITS.payments).map(p => { const o = {date:sDate(p.date, t), amount:sNum(p.amount, 0, 0)}; if(p.mora === true) o.mora = true; else if(p.desc === true) o.desc = true; const g = sOptId(p.group); if(g) o.group = g; return o; })}));
    const o = {id:sId(l.id), clientId:sId(l.clientId), amount:sNum(l.amount, 0, 0), n:cuotas.length, rate:sNum(l.rate, 0, 0, 100), first:sDate(l.first, t), created:sDate(l.created, t),
      notes:sStr(l.notes), fromCaja:!!l.fromCaja, freq:l.freq === 'semanal' ? 'semanal' : 'mensual', cuotas};
    if(l.mode === 'total') o.mode = 'total';
    if(l.example) o.example = true;
    return o;
  });
  const caja = (Array.isArray(d.caja) ? d.caja : []).filter(isObj).slice(0, LIMITS.caja).map(m => ({id:sId(m.id), date:sDate(m.date, t), amount:sNum(m.amount), note:sStr(m.note, 300)}));
  const st = isObj(d.settings) ? d.settings : {}, r = isObj(st.rates) ? st.rates : {};
  const mo = isObj(st.mora) ? st.mora : {}, clamp = (v, lo, hi, d) => { const n = Number(v); return isFinite(n) && v !== '' && v != null ? Math.min(hi, Math.max(lo, n)) : d; };
  const settings = {rates:{A:sNum(r.A, 6, 0, 100), B:sNum(r.B, 9, 0, 100), C:sNum(r.C, 12, 0, 100)}, lockAfter:[0, 60, 300, 900].includes(st.lockAfter) ? st.lockAfter : 60,
    mora:{rate:clamp(mo.rate, 0, 5, 0.3), grace:clamp(mo.grace, 0, 60, 3), cap:clamp(mo.cap, 0, 200, 50)}, payoffDisc:clamp(st.payoffDisc, 0, 100, 50), advanceDisc:clamp(st.advanceDisc, 0, 100, 10),
    lenderName:sStr(st.lenderName, 100)};
  if(sDate(st.lastBackup, '') && st.lastBackup <= t) settings.lastBackup = st.lastBackup;
  const docs = Array.isArray(d.docs) ? d.docs.filter(isObj).slice(0, LIMITS.docs).map(x => ({id:sId(x.id), clientId:sId(x.clientId), loanId:sOptId(x.loanId), kind:Object.prototype.hasOwnProperty.call(DOC_KINDS, x.kind) ? x.kind : 'pagare', date:sDate(x.date, t), name:sStr(x.name, 200), data:sDocData(x.data)})).filter(x => x.data) : null;
  return {settings, clients, loans, caja, docs};
}

function stageImport(text){
  if(UI.locked || !S) return;
  if(typeof text !== 'string' || text.length > 40e6){ toast('La copia es demasiado grande o no es válida.'); return; }
  let d; try { d = JSON.parse(text); } catch(e){ toast('El texto no es una copia válida.'); return; }
  if(isObj(d) && d.enc === 1 && d.salt && d.iv && d.data){
    UI.encImport = d;
    $('#imp-confirm').innerHTML = `<div class="banner"><div class="field" style="flex:1 1 220px"><label for="imp-pass">Esta copia tiene contraseña</label><input id="imp-pass" type="password" autocomplete="off"></div><button class="btn sm primary" data-act="import-decrypt">Abrir copia</button></div>`;
    setTimeout(() => { const i = $('#imp-pass'); if(i) i.focus(); }, 30);
    return;
  }
  if(!valid(d)){ toast('El texto no es una copia válida.'); return; }
  try { d = sanitize(d); } catch(e){ toast('El texto no es una copia válida.'); return; }
  UI.pendingImport = d;
  $('#imp-confirm').innerHTML = `<div class="banner"><span>La copia tiene <b>${d.clients.length} clientes</b> y <b>${d.loans.length} préstamos</b>${Array.isArray(d.docs) ? ' y <b>' + d.docs.length + ' documentos</b>' : ''}. ${d.clients.length ? ' Clientes: ' + d.clients.slice(0, 5).map(c => '<b>' + esc(c.name) + '</b>').join(', ') + (d.clients.length > 5 ? '…' : '') + '.' : ''} Al restaurarla se reemplaza todo lo que hay ahora.</span><button class="btn sm primary" data-act="import-confirm">Restaurar copia</button></div>`;
}

        if(!last) break;
        if(!last.group){ last.group = uid(); save(); }

    }

    case 'advance': openSheet({type:'advance', id}); break;
    case 'gen-bkpass': { const i = $('#bk-pass'); i.type = 'text'; i.value = newRecoveryKey().slice(0, 19); toast('Anotá esta contraseña junto a tu llave de recuperación.'); break; }

      $('#nl-total-wrap').hidden = UI.calcMode !== 'total'; $('#nl-rate-wrap').hidden = UI.calcMode === 'total';
      updatePreview(); break;
    }
    case 'del-mov': S.caja = S.caja.filter(m => m.id !== id); commit('Movimiento borrado'); break;
    case 'pane': UI.sheet.pane = el.dataset.pane; renderSheet(); break;
    case 'open-client-docs': openSheet({type:'client', id, pane:'pagares', loanId:el.dataset.loan, kind:el.dataset.loan ? 'pagare' : undefined}); break;
    case 'open-doc': openSheet({type:'doc', id}); break;
    case 'open-pdf': { const d = DOCS.find(x => x.id === id); if(d && isPdf(d)) openPdf(d); break; }
    case 'del-doc': { const d = DOCS.find(x => x.id === id); DOCS = DOCS.filter(x => x.id !== id); DB.del(id); UI.sheet = {type:'client', id:d.clientId, pane:'pagares', kind:kindOf(d)}; commit('Documento borrado'); break; }
    case 'del-client': docsOf(id).forEach(d => DB.del(d.id)); DOCS = DOCS.filter(d => d.clientId !== id); S.loans = S.loans.filter(l => l.clientId !== id); S.clients = S.clients.filter(c => c.id !== id); closeSheet(); commit('Cliente borrado'); break;

      const l = loan(id), st = loanStats(l), c = client(l.clientId), q = st.next, rest = q.amount - paidOf(q);

      closeSheet(); commit('Ejemplos borrados'); break;

      const pass = $('#imp-pass').value, obj = UI.encImport; if(!obj) break;

      const d = UI.pendingImport; if(!d) break;
      S = {settings:d.settings, clients:d.clients, loans:d.loans, caja:d.caja};
      if(Array.isArray(d.docs)){ DOCS = d.docs; DB.replace(DOCS); }
      UI.pendingImport = null; commit('Copia restaurada'); break;
    }
  }
});

  if(t.closest('form[data-form="payoff"]')) updatePayoff();
  if(t.closest('form[data-form="advance"]')) updateAdvance();

    const [a, b] = t.dataset.set.split('.'), v = t.type === 'number' ? (t.value === '' ? '' : Number(t.value)) : t.value.slice(0, 100);

document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'nl-client' || t.id === 'cl-c_cat'){
    const f = t.form, isNew = f.client.value === '__new';
    $('#nl-newclient').hidden = !isNew;
    f.rate.value = defaultRate(curCat(f), f.freq.value);
    UI.sheet.clientId = isNew ? null : f.client.value;
    updatePreview();
    if(t.id === 'nl-client' && isNew) f.elements.c_name.focus();
  }
  if(t.id === 'nl-freq'){
    const f = t.form, fq = t.value;
    f.rate.value = defaultRate(curCat(f), fq);
    $('#nl-rate-lbl').textContent = 'Tasa ' + PER[fq].word + ' (%)';
    f.first.value = fq === 'semanal' ? addDays(today(), 7) : addMonths(today(), 1);
    updatePreview();
  }
  if(t.id === 'py-mora'){ const amt = $('#py-amount'); amt.value = r2(Number(t.dataset.rest) + (t.checked ? Number(t.dataset.mora) : 0)); }
  if(t.id === 'po-mora') updatePayoff();
  if(t.id === 'ad-mora') updateAdvance();
  if(t.id === 'lock-after'){ S.settings.lockAfter = Number(t.value); save(); toast('Guardado'); }
  if(t.id === 'doc-relink'){ const d = DOCS.find(x => x.id === t.dataset.id); d.loanId = t.value || null; DB.put(d); toast('Guardado'); }
  if(t.id === 'doc-kind' && UI.sheet){ UI.sheet.kind = t.value; renderSheet(); }
  if(t.id === 'doc-kind-edit'){ const d = DOCS.find(x => x.id === t.dataset.id); if(d && Object.prototype.hasOwnProperty.call(DOC_KINDS, t.value)){ d.kind = t.value; DB.put(d); renderSheet(); toast('Guardado'); } }
  if(t.id === 'doc-file' && t.files.length){
    const files = [...t.files], clientId = UI.sheet.id, loanId = $('#doc-loan').value || null;
    const kind = Object.prototype.hasOwnProperty.call(DOC_KINDS, $('#doc-kind').value) ? $('#doc-kind').value : 'pagare';
    toast('Cargando ' + files.length + ' archivo' + (files.length === 1 ? '' : 's') + '…');
    (async () => {
      let ok = 0;
      for(const f of files){
        if(UI.locked) break;
        const pdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
        if(pdf ? !(f.size > 0 && f.size < 10e6) : (!/^image\/(jpeg|png|webp|heic|heif|gif|bmp)$/i.test(f.type) || !(f.size > 0 && f.size < 25e6))) continue;
        try {
          const data = pdf ? await readPdf(f) : await compressImage(f);
          if(UI.locked) break;
          const d = {id:uid(), clientId, loanId, kind, date:today(), name:String(f.name).slice(0, 200), data};
          await DB.put(d);
          if(UI.locked) break;
          DOCS.push(d); ok++;
        } catch(err){}
      }
      if(UI.locked) return;
      if(UI.sheet && UI.sheet.type === 'client' && UI.sheet.id === clientId){ UI.sheet.loanId = loanId; UI.sheet.kind = kind; }
      render();
      toast(ok === files.length ? (ok === 1 ? 'Documento guardado' : ok + ' documentos guardados') : 'Algunos archivos no se cargaron: tienen que ser fotos (JPG, PNG o WEBP) de hasta 25 MB o PDF de hasta 10 MB.');
    })();
  }
  if(t.id === 'imp-file' && t.files[0] && t.files[0].size > 40e6){ toast('El archivo es demasiado grande para ser una copia de la Libreta.'); t.value = ''; return; }
  if(t.id === 'imp-file' && t.files[0]){ const rd = new FileReader(); rd.onload = () => stageImport(String(rd.result)); rd.readAsText(t.files[0]); }
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if(f.dataset.form === 'unlock'){ once(() => tryUnlock(f)); return; }
  if(f.dataset.form === 'setup'){ once(() => createPin(f)); return; }
  if(f.dataset.form === 'newpin'){ once(() => resetPin(f)); return; }
  if(f.dataset.form === 'pin'){ once(() => pinForm(f)); return; }
  const err = (id, msg) => { const p = $(id); p.textContent = msg; p.hidden = false; };
  if(f.dataset.form === 'loan'){
    const a = Number(f.amount.value), n = parseInt(f.n.value, 10), r = Number(f.rate.value);
    if(!(a > 0)) return err('#nl-err', 'Poné el monto prestado.');
    if(!(n >= 1 && n <= 120)) return err('#nl-err', 'La cantidad de cuotas tiene que ser entre 1 y 120.');
    const byTotal = UI.calcMode === 'total', tot = Number(f.total.value);
    if(byTotal && !(tot > 0)) return err('#nl-err', 'Poné cuánto querés que te devuelva en total.');
    if(byTotal && tot < a) return err('#nl-err', 'El total a devolver no puede ser menor a lo que prestás.');
    if(!byTotal && (!(r >= 0 && r <= 100) || f.rate.value === '')) return err('#nl-err', 'Poné una tasa entre 0 y 100.');
    if(!f.first.value) return err('#nl-err', 'Elegí la fecha de la primera cuota.');
    let clientId = f.client.value;
    if(clientId === '__new'){
      const nc = clientFields(f, 'c_');
      if(!nc.name){ f.elements.c_name.focus(); return err('#nl-err', 'Poné el nombre y apellido del cliente nuevo.'); }
      const dni = (nc.dni || '').replace(/\D/g, '');
      const dup = dni && S.clients.find(c => (c.dni || '').replace(/\D/g, '') === dni);
      if(dup) return err('#nl-err', 'Ya tenés un cliente con ese DNI: ' + dup.name + '. Elegilo en la lista de clientes.');
      const c = {id:uid(), ...nc}; S.clients.push(c); clientId = c.id;
    }
    const l = {id:uid(), clientId, amount:r2(a), n, rate:r, first:f.first.value, created:today(), notes:f.notes.value.trim(), fromCaja:f.fromCaja.checked, freq:f.freq.value, cuotas:buildSchedule(r2(a), n, r, f.first.value, f.freq.value)};
    if(byTotal){ const res = scheduleByTotal(r2(a), n, r2(tot), f.first.value, f.freq.value); l.cuotas = res.cuotas; l.rate = res.rate; l.mode = 'total'; }
    S.loans.push(l); save(); UI.sheet = {type:'loan', id:l.id}; render(); toast('Préstamo guardado');
  }
  if(f.dataset.form === 'client'){
    const name = f.name.value.trim();
    if(!name) return err('#cl-err', 'Poné el nombre del cliente.');
    const s = UI.sheet;
    if(s.id){ const c = S.clients.find(x => x.id === s.id); Object.assign(c, {...clientFields(f), name}); delete c.example; commit('Cliente guardado'); }
    else { const c = {id:uid(), ...clientFields(f), name}; S.clients.push(c); save(); UI.sheet = s.returnTo === 'new-loan' ? {type:'new-loan', clientId:c.id} : {type:'client', id:c.id}; render(); toast('Cliente guardado'); }
  }
  if(f.dataset.form === 'pay'){
    const a = Number(f.amount.value);
    if(!(a > 0)) return err('#py-err', 'Poné el monto que cobraste.');
    if(!f.date.value) return err('#py-err', 'Elegí la fecha del cobro.');
    const s = UI.sheet, l = loan(s.id), res = applyPayment(l, s.i, a, f.date.value, !!(f.mora && f.mora.checked));
    save(); UI.sheet = {type:'loan', id:l.id, lastGroup:res.group}; render();
    toast(res.left > 0.5 ? 'Cobro registrado. Sobraron ' + money(res.left) + ' (el préstamo ya está pago).' : 'Cobro registrado');
  }
  if(f.dataset.form === 'advance'){
    const l = loan(f.dataset.id); if(!l) return;
    const k = Number(f.k.value), p = Number(f.pct.value), max = l.cuotas.filter(q => paidOf(q) < q.amount - 0.5).length;
    if(!(k >= 1 && k <= max && Math.round(k) === k)) return err('#ad-err', 'La cantidad de cuotas tiene que ser entre 1 y ' + max + '.');
    if(!(p >= 0 && p <= 100)) return err('#ad-err', 'El descuento tiene que ser entre 0 y 100%.');
    if(!f.date.value) return err('#ad-err', 'Elegí la fecha del pago.');
    const group = applyAdvance(l, k, p, f.date.value, f.mora.checked);
    save(); UI.sheet = {type:'loan', id:l.id, lastGroup:group}; render(); toast(k === 1 ? 'Cuota adelantada' : k + ' cuotas adelantadas');
  }
  if(f.dataset.form === 'payoff'){
    const l = loan(f.dataset.id); if(!l) return;
    const p = Number(f.pct.value);
    if(!(p >= 0 && p <= 100)) return err('#po-err', 'El descuento tiene que ser entre 0 y 100%.');
    if(!f.date.value) return err('#po-err', 'Elegí la fecha del pago.');
    const group = applyPayoff(l, p, f.date.value, f.mora.checked);
    save(); UI.sheet = {type:'loan', id:l.id, lastGroup:group}; render(); toast('Préstamo cancelado');
  }
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && UI.sheet) closeSheet(); });

document.addEventListener('visibilitychange', () => {
  if(!getKeys() || (UI.locked && !UI.sensitive) || (!S && !UI.pendingRaw)) return;
  const after = UI.sensitive ? Math.min(60, S ? (S.settings.lockAfter ?? 60) : 60) : (S.settings.lockAfter ?? 60);
  if(document.hidden){ UI.hiddenAt = Date.now(); if(after === 0) lockApp(); }
  else if(UI.hiddenAt && Date.now() - UI.hiddenAt >= after * 1000) lockApp();
});

(async () => {
  if(!CAN_ENCRYPT){
    const blob = rawLoad();
    if(blob && blob.enc){ showLock('<div class="lock-box"><h1>Libreta</h1><p class="note">Este navegador no puede abrir los datos cifrados. Abrí la app desde https://lsacril.github.io/libreta</p></div>'); return; }
    const c0 = sanitize(valid(blob) ? blob : seed());
    S = normalize({settings:c0.settings, clients:c0.clients, loans:c0.loans, caja:c0.caja}); save();
    DOCS = await DB.all();
    unlockApp();
    return;
  }
  if(getKeys() || getPin()) screenUnlock(); else screenSetup('new');
})();
})();
</script>
